name: Unpack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          Z=$(ls -1 *.zip | head -n1)
          unzip -o "$Z"
          rm -rf AuroraChat/.github
          cp -r AuroraChat/. .
          rm -rf AuroraChat aurora-relay README.md "$Z"
          git config user.name "unpack"
          git config user.email "unpack@example.com"
          git add -A
          git commit -m "Update from $Z"
          git push
