name: Unpack
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o aurora-chat-stage1.zip
          rm -rf AuroraChat/.github
          cp -r AuroraChat/. .
          rm -rf AuroraChat aurora-relay README.md aurora-chat-stage1.zip
          git config user.name "unpack"
          git config user.email "unpack@example.com"
          git add -A
          git commit -m "Unpack project"
          git push
